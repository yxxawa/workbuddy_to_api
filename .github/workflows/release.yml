name: Portable Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '4.5.1'
permissions:
  contents: read
concurrency:
  group: portable-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
          architecture: ${{ matrix.arch }}
      - name: Install dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.22.3
      - name: Build and verify native executable
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python .github/scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.arch }}
          path: release/*.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          merge-multiple: true
          path: release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release/WB-Gateway-v${VERSION}-windows-x64.exe
          test -f release/WB-Gateway-v${VERSION}-windows-arm64.exe
          (cd release && sha256sum *.exe > SHA256SUMS.txt)
          TAG=v${VERSION}
          gh release create $TAG --target $COMMIT --title $TAG --notes '' --draft
          gh release upload $TAG release/*.exe release/SHA256SUMS.txt
          gh release edit $TAG --draft=false
